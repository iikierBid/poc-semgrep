name: SAST Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        # Executa o Semgrep CLI diretamente, usando o conjunto de regras "p/default"
        # que é um conjunto abrangente de regras da comunidade.
        # O comando irá falhar (exit code diferente de 0) se encontrar vulnerabilidades,
        # o que irá bloquear o PR, como desejado.
        run: semgrep ci --config "p/default" --sarif --output=semgrep.sarif

      - name: Upload SARIF file
        # Este passo só será executado se o scan for bem-sucedido (não encontrar nada).
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: error # Garante que o job falhe se o arquivo não for criado


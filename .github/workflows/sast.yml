name: SAST Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        # Voltamos a usar a Action oficial, que é mais limpa e legível.
        # A action executa 'semgrep ci' por padrão e bloqueia em severidade 'ERROR'.
        uses: semgrep/semgrep-action@v2
        with:
          # Usamos o conjunto de regras focado em segredos.
          config: "p/secrets"

      - name: Show custom error on failure
        # Este passo só executa se o passo anterior falhar (graças a `if: failure()`).
        # Ele usa a anotação '::error::' para criar uma mensagem de erro clara e visível.
        if: failure()
        run: |
          echo "::error::Bloqueio de PR: Foram encontradas vulnerabilidades que violam a política de segurança. Por favor, verifique os logs do passo 'Run Semgrep Scan' acima para ver os detalhes das vulnerabilidades."

      - name: Upload SARIF file
        # Este passo só será executado se o scan for bem-sucedido (não encontrar nada).
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: error # Garante que o job falhe se o arquivo não for criado


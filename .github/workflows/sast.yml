name: SAST Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        # Use a Action oficial do Semgrep
        uses: semgrep/semgrep-action@main
        with:
          # A configuração 'auto' permite que o Semgrep escolha as melhores regras
          # para o seu projeto. Para mais configurações, veja a documentação do Semgrep.
          config: "auto"
          # Gera a saída no formato SARIF, que é o padrão para ferramentas de análise
          # e pode ser importado pelo DefectDojo e pelo GitHub Security tab.
          sarif_output: semgrep.sarif

      - name: Upload SARIF file
        # Faz o upload do arquivo SARIF como um artefato para que possamos usá-lo
        # em outros jobs ou para download.
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: error # Garante que o job falhe se o arquivo não for criado


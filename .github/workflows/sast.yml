name: SAST Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        # Voltamos a usar 'semgrep ci', que é o comando ideal para o dia a dia.
        # Ele é "diff-aware", ou seja, só irá falhar se o Pull Request
        # introduzir NOVAS vulnerabilidades, ignorando as já existentes na 'main'.
        # Isso impede que o débito técnico de segurança bloqueie novos desenvolvimentos.
        # Usamos o config 'p/secrets' e a flag '--fail-on warning' para sermos mais rigorosos.
        run: semgrep ci --config "p/secrets" --fail-on warning --sarif --output=semgrep.sarif

      - name: Show custom error on failure
        # Este passo só executa se o passo anterior falhar (graças a `if: failure()`).
        # Ele usa a anotação '::error::' para criar uma mensagem de erro clara e visível.
        if: failure()
        run: |
          echo "::error::Bloqueio de PR: Foram encontradas vulnerabilidades que violam a política de segurança. Por favor, verifique os logs do passo 'Run Semgrep Scan' acima para ver os detalhes das vulnerabilidades."

      - name: Upload SARIF file
        # Este passo só será executado se o scan for bem-sucedido (não encontrar nada).
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: error # Garante que o job falhe se o arquivo não for criado

